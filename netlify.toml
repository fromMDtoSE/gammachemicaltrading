# Static site: nothing to build. Only public/ is published, so the README and other repo files are not served.
# The inquiry form (data-netlify in public/index.html) is picked up by Netlify Forms at deploy time.
[build]
  command = "echo 'Static site, nothing to build'"
  publish = "public"

# The Netlify UI still has the Next.js runtime plugin installed from the old site. This tells it to stand down.
[build.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
